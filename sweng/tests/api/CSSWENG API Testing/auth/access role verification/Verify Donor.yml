info:
  name: Verify Donor
  type: http
  seq: 1

http:
  method: GET
  url: "{{SUPABASE_URL}}/rest/v1/profiles?id=eq.{{donor_id}}&select=role"
  headers:
    - name: apikey
      value: "{{SUPABASE_ANON_KEY}}"
    - name: Authorization
      value: Bearer {{donor_token}}
  params:
    - name: id
      value: eq.{{donor_id}}
      type: query
    - name: select
      value: role
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Profile request was successful", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("User has the correct enum role", function() {
          const data = res.getBody();
          
          // Verify the array exists and isn't empty
          expect(data).to.be.an('array').that.is.not.empty;
          
          // Check the role of the first object in the array
          expect(data[0].role).to.equal("donor"); 
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
