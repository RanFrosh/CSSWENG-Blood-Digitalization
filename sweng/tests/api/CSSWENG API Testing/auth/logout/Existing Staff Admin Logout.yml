info:
  name: Existing Staff Admin Logout
  type: http
  seq: 5

http:
  method: POST
  url: "{{SUPABASE_URL}}/auth/v1/logout"
  headers:
    - name: apikey
      value: "{{SUPABASE_ANON_KEY}}"
    - name: Authorization
      value: Bearer {{staff_admin_token}}
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Logout was successful (204 No Content)", function() {
          expect(res.getStatus()).to.equal(204);
        });

        test("Response body is empty", function() {
          expect(res.getBody()).to.equal(""); 
        });

        // clear access token upon successful logout
        if (res.getStatus() === 204) {
          bru.setEnvVar("staff_admin_token", "");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
